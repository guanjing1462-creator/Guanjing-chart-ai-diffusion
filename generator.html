<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>谱面生成器 · 音频 + 难度 + 键型</title>
<style>
  :root{
    --bg:#06070d; --ink:#e8f2ff; --dim:#7d90ad; --line:rgba(90,150,220,.25);
    --cyan:#38e8ff; --pink:#ff4fd8; --amber:#ffc23d; --mint:#4dffa6;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
    font:13px/1.6 system-ui,-apple-system,"PingFang SC",sans-serif}
  #stage{position:fixed;inset:0 0 178px 0}
  .panel{position:fixed;left:0;right:0;bottom:0;height:178px;border-top:1px solid var(--line);
    background:rgba(9,15,27,.96);backdrop-filter:blur(16px);padding:12px 20px;overflow-y:auto}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:9px}
  button,label.pick{appearance:none;border:1px solid var(--line);background:#101a2c;color:var(--ink);
    height:32px;padding:0 14px;border-radius:9px;cursor:pointer;font-size:12.5px;
    display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  button:hover{border-color:rgba(56,232,255,.55)}
  button.primary{background:linear-gradient(135deg,rgba(56,232,255,.18),rgba(255,79,216,.14));
    border-color:rgba(56,232,255,.45)}
  button:disabled{opacity:.45;cursor:not-allowed}
  .tag{font-size:11px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase;margin-right:2px}
  input[type=range]{width:180px;accent-color:#38e8ff}
  select{background:#0f1a2c;color:#e8f2ff;border:1px solid var(--line);border-radius:8px;
    height:30px;padding:0 8px;font-size:12px;outline:none}
  .val{font-variant-numeric:tabular-nums;color:var(--cyan);min-width:52px;display:inline-block}
  .pats{display:flex;gap:6px;flex-wrap:wrap}
  .pat{font-size:11.5px;border:1px solid var(--line);border-radius:8px;padding:4px 10px;cursor:pointer;
    color:var(--dim);background:rgba(10,17,32,.6);user-select:none}
  .pat.on{color:var(--cyan);border-color:rgba(56,232,255,.65);background:rgba(56,232,255,.10)}
  .top{position:fixed;left:16px;top:13px;color:var(--dim);font-size:11.5px;line-height:1.85;pointer-events:none}
  .top b{color:var(--ink);font-weight:600}
  .top .ok{color:var(--mint)}
  .stat{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--dim)}
  .stat b{color:var(--ink);font-variant-numeric:tabular-nums}
  .drop{position:fixed;inset:0;display:grid;place-items:center;background:rgba(6,7,13,.92);z-index:30;
    transition:opacity .25s;pointer-events:none;opacity:0}
  .drop.on{opacity:1;pointer-events:auto}
  .drop .box{border:2px dashed rgba(56,232,255,.45);border-radius:18px;padding:34px 52px;text-align:center}
  .hint{color:var(--dim);font-size:11px;margin-left:6px}
</style>
</head>
<body>
<div id="stage"></div>

<div class="top" id="top">
  <b>谱面生成器</b> · 音频 → 难度 + 键型 → .osu<br>
  <span id="audioInfo">等待音频…</span>
</div>

<div class="drop" id="drop"><div class="box">
  <div style="font-size:15px;margin-bottom:6px">松手载入音频</div>
  <div style="color:#7d90ad;font-size:12px">mp3 / wav / ogg / m4a</div>
</div></div>

<div class="panel">
  <div class="row">
    <label class="pick"><input type="file" id="file" accept="audio/*" hidden>选择音频</label>
    <button id="btnDemo">用测试音频</button>
    <span class="tag">模式</span>
    <select id="genMode" title="onset：音符落在音频峰上；grid：按 BPM 网格铺">
      <option value="onset">采音优先</option>
      <option value="grid">节奏优先</option>
    </select>
    <span class="tag">难度</span>
    <input type="range" id="star" min="1" max="10" step="0.1" value="4">
    <span class="val" id="starVal">4.0★</span>
    <span class="val" id="npsVal" style="color:#ffc23d">11.5 nps</span>
    <button class="primary" id="btnGen" disabled>生成谱面</button>
    <button id="btnExport" disabled>导出 .osu</button>
  </div>

  <div class="row">
    <span class="tag">键型</span>
    <div class="pats" id="pats"></div>
  </div>

  <canvas id="curve" width="2000" height="56" style="width:100%;height:44px;display:block;margin:6px 0 4px;border-radius:8px;background:rgba(8,14,26,.7)"></canvas>
  <div class="stat" id="stat"></div>
</div>

<script src="../01-app/osu-skin.js"></script>
<script src="../01-app/scene3d.js"></script>
<script src="src/chart-patterns.js"></script>
<script src="src/audio-onsets.js"></script>
<script>
(function () {
  var stage = document.getElementById('stage');
  var topEl = document.getElementById('top');
  var infoEl = document.getElementById('audioInfo');
  var statEl = document.getElementById('stat');
  var dropEl = document.getElementById('drop');

  var audio = null;       // 分析结果
  var audioName = '';
  var ctrl = null;
  var gen = null;         // 生成结果
  var densityCurve = null; // 情感曲线（每格的密度系数）
  var audioPeaks = null;   // 细包络上的 onset 峰，用于音符时间吸附
  var notes = null;

  /* 难度 → 密度：从 406 张真实 ranked 谱拟合出来的（nps ≈ 2.93 × stars − 0.17） */
  function npsOfStar(s) { return Math.max(1.6, 2.93 * s - 0.17); }

  /* 情感曲线：把音频强度做滑窗平均，归一化到「平均值 = 1」。
     结果直接当密度系数用 —— 高潮段 > 1（更密），平静段 < 1（更疏）。
     窗口默认 2 秒，太短会跟着鼓点抖，太长会抹掉段落起伏。 */
  function makeDensityCurve(accent, stepMs, winSec) {
    var win = Math.max(4, Math.round((winSec || 2) * 1000 / stepMs));
    var n = accent.length;
    var out = new Float32Array(n);
    var prefix = new Float64Array(n + 1);
    for (var i = 0; i < n; i++) prefix[i + 1] = prefix[i] + accent[i];
    for (var j = 0; j < n; j++) {
      var lo = Math.max(0, j - win);
      var hi = Math.min(n, j + win + 1);
      out[j] = (prefix[hi] - prefix[lo]) / (hi - lo);
    }
    // 归一化：均值 = 1
    var sum = 0;
    for (var k = 0; k < n; k++) sum += out[k];
    var mean = sum / n || 1;
    for (var m = 0; m < n; m++) {
      out[m] = Math.max(0.35, Math.min(1.65, out[m] / mean));
    }
    return out;
  }

  function drawCurve(accent, curve) {
    var cv = document.getElementById('curve');
    if (!cv || !accent) return;
    var ctx = cv.getContext('2d');
    var W = cv.width, H = cv.height;
    ctx.clearRect(0, 0, W, H);
    var n = accent.length;
    var barW = W / n;

    // 底：每格音频强度
    for (var i = 0; i < n; i++) {
      var h = Math.max(1, accent[i] * (H - 10));
      ctx.fillStyle = 'rgba(56,232,255,.30)';
      ctx.fillRect(i * barW, H - h, Math.max(1, barW - 0.5), h);
    }
    // 上：密度系数曲线
    if (curve) {
      ctx.beginPath();
      for (var j = 0; j < n; j++) {
        var y = H - (curve[j] / 1.65) * (H - 6) - 3;
        if (j === 0) ctx.moveTo(0, y); else ctx.lineTo(j * barW, y);
      }
      ctx.strokeStyle = 'rgba(255,79,216,.95)';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    // 中线（=1）
    ctx.strokeStyle = 'rgba(125,144,173,.35)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, H - (1 / 1.65) * (H - 6) - 3);
    ctx.lineTo(W, H - (1 / 1.65) * (H - 6) - 3);
    ctx.stroke();
  }

  /* 键型选择：默认给一组常见的混合 */
  var PATS = [
    { k: 'stream', label: '乱键', on: true },
    { k: 'jumpstream', label: '双押切', on: true },
    { k: 'handstream', label: '三押切', on: false },
    { k: 'trill', label: '交互', on: true },
    { k: 'jack', label: '叠键', on: false },
    { k: 'roll', label: '滚动', on: false },
    { k: 'ladder', label: '梯子', on: false },
    { k: 'staircase', label: '钩子', on: false },
    { k: 'jumptrill', label: '对拍', on: false },
    { k: 'splittrill', label: '对切', on: false },
    { k: 'splitrail', label: '散点', on: false },
    { k: 'minijack', label: '子弹', on: false },
    { k: 'anchor', label: '锚键', on: false }
  ];

  var patsEl = document.getElementById('pats');
  PATS.forEach(function (p, i) {
    var d = document.createElement('div');
    d.className = 'pat' + (p.on ? ' on' : '');
    d.textContent = p.label;
    d.dataset.k = p.k;
    d.addEventListener('click', function () {
      // 至少留一个
      var on = Array.prototype.filter.call(patsEl.children, function (c) { return c.classList.contains('on'); });
      if (d.classList.contains('on') && on.length === 1) return;
      d.classList.toggle('on');
      refreshStat();
    });
    patsEl.appendChild(d);
  });

  function selectedPatterns() {
    var w = {};
    Array.prototype.forEach.call(patsEl.children, function (c) {
      if (c.classList.contains('on')) w[c.dataset.k] = 1;
    });
    return w;
  }

  /* ---------- 星级滑块 ---------- */
  var starEl = document.getElementById('star');
  function syncStar() {
    var s = parseFloat(starEl.value);
    document.getElementById('starVal').textContent = s.toFixed(1) + '★';
    document.getElementById('npsVal').textContent = npsOfStar(s).toFixed(1) + ' nps';
  }
  starEl.addEventListener('input', syncStar);
  syncStar();

  /* ---------- 载入音频 ---------- */
  function loadArrayBuffer(buf, name) {
    // 传 ArrayBuffer 走解码；传 AudioBuffer（合成音频）直接分析
    var isAudioBuffer = buf && typeof buf.numberOfChannels === 'number';
    audioName = name || 'audio';
    infoEl.textContent = '分析中…';
    // analyzeBuffer 是同步的（不需要解码），analyze 返回 Promise，统一成 Promise
    var job = isAudioBuffer
      ? Promise.resolve(AudioOnsets.analyzeBuffer(buf, {}))
      : AudioOnsets.analyze(buf, {});
    job.then(function (res) {
      audio = res;
      infoEl.innerHTML =
        '<span class="ok">已分析</span> · ' + res.durationSec + 's · ' +
        'BPM <b>' + res.bpm + '</b>（置信 ' + Math.round(res.bpmConfidence * 100) + '%） · ' +
        'offset ' + res.offsetMs + 'ms · ' + res.steps + ' 步';
      densityCurve = makeDensityCurve(res.accent, res.stepMs, 2);
      drawCurve(res.accent, densityCurve);

      // 细包络上的峰值：音符时间会优先吸附到这些点（真正「踩鼓点」）
      if (res.fine && res.fine.energy) {
        /* 阈值别定太死：45ms 间隔 + 0.85σ 在 337 秒的歌上只找到 2037 个峰
           （约 6 个/秒），撑不满 4★ 需要的 11.6 nps 事件数。
           25ms + 0.55σ 能给出约 10–12 个/秒的候选，再由段内配额挑强的。 */
        audioPeaks = AudioOnsets.detectPeaks(res.fine.energy, res.fine.hopMs, {
          winMs: 160, delta: 0.55, minGapMs: 25
        });
      }
      document.getElementById('btnGen').disabled = false;
      refreshStat();
    }).catch(function (e) {
      infoEl.textContent = '分析失败：' + (e && e.message || e);
    });
  }

  document.getElementById('file').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!f) return;
    f.arrayBuffer().then(function (b) { loadArrayBuffer(b, f.name.replace(/\.[^.]+$/, '')); });
  });

  /* 拖拽 */
  ['dragenter', 'dragover'].forEach(function (ev) {
    window.addEventListener(ev, function (e) { e.preventDefault(); dropEl.classList.add('on'); });
  });
  ['dragleave', 'drop'].forEach(function (ev) {
    window.addEventListener(ev, function (e) { e.preventDefault(); dropEl.classList.remove('on'); });
  });
  window.addEventListener('drop', function (e) {
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) f.arrayBuffer().then(function (b) { loadArrayBuffer(b, f.name.replace(/\.[^.]+$/, '')); });
  });

  /* ---------- 测试音频：现场合成一段 128 BPM 的鼓点 ---------- */
  document.getElementById('btnDemo').addEventListener('click', function () {
    var sr = 44100, dur = 24, bpm = 128;
    var beat = 60 / bpm;
    var n = Math.floor(sr * dur);
    var off = new OfflineAudioContext(1, n, sr);
    var buf = off.createBuffer(1, n, sr);
    var ch = buf.getChannelData(0);
    // 底鼓 + 军鼓 + 踩镲的简易合成
    for (var b = 0; b * beat < dur; b++) {
      var t0 = b * beat;
      // 底鼓（每 4 拍的第 1、3 拍）
      if (b % 4 === 0 || b % 4 === 2) synthKick(ch, sr, t0, 0.9);
      // 军鼓（第 2、4 拍）
      if (b % 4 === 1 || b % 4 === 3) synthSnare(ch, sr, t0, 0.6);
      // 踩镲（八分）
      synthHat(ch, sr, t0, 0.22);
      synthHat(ch, sr, t0 + beat / 2, 0.16);
    }
    function synthKick(c, sr, t, amp) {
      var s0 = Math.floor(t * sr), len = Math.floor(0.18 * sr);
      for (var i = 0; i < len; i++) {
        var tt = i / sr;
        var env = Math.exp(-tt * 22);
        var f = 110 * Math.exp(-tt * 28) + 42;
        c[s0 + i] += Math.sin(2 * Math.PI * f * tt) * env * amp;
      }
    }
    function synthSnare(c, sr, t, amp) {
      var s0 = Math.floor(t * sr), len = Math.floor(0.12 * sr);
      for (var i = 0; i < len; i++) {
        var tt = i / sr;
        c[s0 + i] += (Math.random() * 2 - 1) * Math.exp(-tt * 32) * amp * 0.6;
      }
    }
    function synthHat(c, sr, t, amp) {
      var s0 = Math.floor(t * sr), len = Math.floor(0.04 * sr);
      for (var i = 0; i < len; i++) {
        var tt = i / sr;
        c[s0 + i] += (Math.random() * 2 - 1) * Math.exp(-tt * 90) * amp * 0.35;
      }
    }
    loadArrayBuffer(buf, 'demo-128bpm');   // AudioBuffer 直接给，不用 .buffer
  });

  /* ---------- 生成 ---------- */
  document.getElementById('btnGen').addEventListener('click', generate);

  function generate() {
    if (!audio) return;
    var star = parseFloat(starEl.value);
    var weights = selectedPatterns();

    var mode = (document.getElementById('genMode') || {}).value || 'onset';

    if (mode === 'onset' && audio.fine && audioPeaks && audioPeaks.length) {
      /* 主路线：先按 onset 定时刻，再定键位。
         不依赖 BPM 检测（真实音乐上它经常错 1.5 倍），音符直接落在音频峰上。 */
      var r = ChartPatterns.generateFromPeaks({
        keys: 4,
        nps: npsOfStar(star),
        weights: weights,
        fine: audio.fine,
        peaks: audioPeaks,
        durationSec: audio.durationSec,
        sectionSec: 8,
        rnd: Math.random
      });
      gen = { columns: null, sections: r.sections, meta: r.meta };
      notes = r.notes;
    } else {
      /* 备用：BPM 网格 + 时间吸附。BPM 检测准的时候（合成音频）更稳。 */
      gen = ChartPatterns.generate({
        steps: audio.steps,
        stepMs: audio.stepMs,
        nps: npsOfStar(star),
        weights: weights,
        sectionSteps: Math.max(16, Math.min(64, Math.floor(audio.steps / 6))),
        accent: audio.accent,
        densityCurve: densityCurve,
        rnd: Math.random
      });
      notes = ChartPatterns.toNotes(gen.columns, audio.stepMs, audio.offsetMs, {
        fine: audio.fine,
        peaks: audioPeaks,
        snapMs: Math.min(audio.stepMs * 0.42, 48),
        minGapMs: 18
      });
    }

    var chart = {
      keys: 4,
      bpm: audio.bpm,
      totalTime: notes.length ? notes[notes.length - 1].t + 1200 : 4000,
      notes: notes,
      metadata: {
        title: audioName + ' (AI)',
        artist: 'scene3d generator',
        version: star.toFixed(1) + '★ ' + Object.keys(weights).length + ' patterns'
      }
    };

    if (ctrl) { ctrl.dispose(); ctrl = null; }
    Scene3D.mount(stage, chart, {
      autoRotate: true, tilt: true, bloom: true, loop: false,
      // 用 offset 把节拍网格对齐到音乐起点
      startAt: 0
    }).then(function (c) {
      ctrl = c;
      window.__genCtrl = c;
      c.play();
    });

    document.getElementById('btnExport').disabled = false;
    refreshStat();
  }

  /* ---------- 统计 ---------- */
  function refreshStat() {
    if (!audio) {
      statEl.innerHTML = '<span>载入音频后可生成。测试音频是现场合成的 128 BPM 鼓点。</span>';
      return;
    }
    var dur = audio.steps * audio.stepMs / 1000;
    var targetNps = npsOfStar(parseFloat(starEl.value));
    var estNotes = Math.round(targetNps * dur);
    var parts = [
      '时长 <b>' + dur.toFixed(1) + 's</b>',
      '目标密度 <b>' + targetNps.toFixed(1) + ' nps</b>',
      '预计音符 <b>' + estNotes + '</b>'
    ];
    if (gen) {
      parts.push('实际生成 <b>' + gen.meta.notes + '</b> notes');
      parts.push('实际密度 <b>' + gen.meta.nps + ' nps</b>');
      parts.push('段落 <b>' + gen.sections.length + '</b>');
      var names = {};
      gen.sections.forEach(function (s) { names[s.label] = (names[s.label] || 0) + 1; });
      parts.push('用到的键型 <b>' + Object.keys(names).join(' / ') + '</b>');
      if (audio.fine && audio.fine.energy) {
        /* 采音对齐度 = 音符所在帧的平均 RMS / 全局平均 RMS。
           用 11.6ms 的细包络算（音乐网格太粗，会把吸附的效果抹平）。
           >1 说明音符确实偏向有声处；=1 等于随机铺格子。
           人类谱面实测 ×1.40，这是及格线。 */
        var fe = audio.fine.energy, fh = audio.fine.hopMs;
        var sumAll = 0;
        for (var q = 0; q < fe.length; q++) sumAll += fe[q];
        var avgAll = sumAll / fe.length || 1e-9;
        var sumNote = 0, cnt = 0;
        notes.forEach(function (n) {
          var idx = Math.round(n.t / fh);
          if (idx >= 0 && idx < fe.length) { sumNote += fe[idx]; cnt++; }
        });
        var ratio = cnt ? (sumNote / cnt) / avgAll : 1;
        var st = notes.snapStats || {};
        var snapTxt = st.steps ? '，吸附 <b>' + Math.round(st.snapped / st.steps * 100) + '%</b> 的音符时间' : '';
        parts.push('采音对齐 <b>×' + ratio.toFixed(2) + '</b>（人类 ×1.39，随机 ×1.00）' + snapTxt);
      }
    }
    statEl.innerHTML = parts.map(function (x) { return '<span>' + x + '</span>'; }).join('');
  }

  /* ---------- 导出 .osu ---------- */
  document.getElementById('btnExport').addEventListener('click', function () {
    if (!notes || !audio) return;
    var X = [64, 192, 320, 448];
    var beat = 60000 / audio.bpm;
    var lines = [
      'osu file format v14', '',
      '[General]', 'AudioFilename: ' + audioName + '.mp3', 'Mode: 3', 'PreviewTime: ' + Math.round(audio.offsetMs + 30000), '',
      '[Metadata]',
      'Title:' + audioName + ' (AI)',
      'TitleUnicode:' + audioName + ' (AI)',
      'Artist:scene3d generator',
      'Creator:chart-patterns',
      'Version:' + parseFloat(starEl.value).toFixed(1) + '★',
      'Tags:ai generated scene3d',
      '',
      '[Difficulty]',
      'HPDrainRate:8', 'CircleSize:4', 'OverallDifficulty:8', 'ApproachRate:5', 'SliderMultiplier:1.4', 'SliderTickRate:1',
      '',
      '[TimingPoints]',
      Math.round(audio.offsetMs) + ',' + beat.toFixed(4) + ',4,2,1,70,1,0',
      ''
    ];
    // AI 声明：Mug Diffusion 的做法，这里沿用同约定
    lines.push('[HitObjects]');
    notes.forEach(function (n) {
      lines.push(X[n.col] + ',192,' + n.t + ',1,0,0:0:0:0:');
    });
    lines.push('// AIMode: scene3d chart-patterns v1.0.0');

    var blob = new Blob([lines.join('\n')], { type: 'text/plain;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = audioName + ' [' + parseFloat(starEl.value).toFixed(1) + 'star].osu';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 8000);
  });

  window.__gen = {
    get audio() { return audio; },
    get gen() { return gen; },
    get notes() { return notes; },
    get audioPeaks() { return audioPeaks; },
    generate: generate,
    loadBuffer: loadArrayBuffer,
    npsOfStar: npsOfStar
  };

  refreshStat();
})();
</script>
</body>
</html>
